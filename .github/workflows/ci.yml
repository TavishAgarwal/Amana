name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: amana, POSTGRES_PASSWORD: change-me-locally, POSTGRES_DB: amana }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U amana" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }  # openmined-psi ships wheels for 3.12 and 3.13 only
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }  # the wallet tests load TypeScript with --experimental-strip-types
      # The wallet tests check the phone code against the Python services, so they need the Python side too.
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --group dev
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install && az bicep build -f infra/azure/main.bicep --stdout > /dev/null
      - run: docker compose -f docker-compose.stack.yml config -q
      - run: docker build -f infra/docker/api.Dockerfile -t amana-api .
      - run: docker build -f infra/docker/relay.Dockerfile -t amana-relay .
